name: Refresh GitHub profile telemetry

on:
  schedule:
    - cron: '17 8 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-profile-telemetry.yml'
      - 'tools/update-github-telemetry.mjs'

permissions:
  contents: write

concurrency:
  group: profile-telemetry-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4

      - name: Fetch current public GitHub data and render cards
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node tools/update-github-telemetry.mjs

      - name: Commit cards when the data changed
        run: |
          if git diff --quiet -- assets/github-activity-dark.svg assets/github-activity-light.svg assets/github-stats-dark.svg assets/github-stats-light.svg assets/github-languages-dark.svg assets/github-languages-light.svg; then
            echo 'Telemetry cards are already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/github-activity-dark.svg assets/github-activity-light.svg assets/github-stats-dark.svg assets/github-stats-light.svg assets/github-languages-dark.svg assets/github-languages-light.svg
          git commit -m 'Refresh GitHub profile telemetry'
          git push
