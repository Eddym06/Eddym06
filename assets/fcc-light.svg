<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="190" viewBox="0 0 1200 190" role="img" aria-labelledby="title">
<title id="title">Five completed freeCodeCamp Python certification projects: Configuration Manager, Budget App, Polygon Area Calculator, Hash Table and Tower of Hanoi.</title>
<defs>
  <linearGradient id="accent"><stop stop-color="#007f83"/><stop offset=".5" stop-color="#7046d5"/><stop offset="1" stop-color="#a84b08"/></linearGradient>
  <radialGradient id="aura"><stop stop-color="#7046d5" stop-opacity=".2"/><stop offset="1" stop-color="#f5f4ff" stop-opacity="0"/></radialGradient>
  <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#d7d9ed" stroke-width=".7"/></pattern>
</defs>
<style>
text{font-family:Segoe UI,Arial,sans-serif} .mono{font-family:Consolas,monospace;letter-spacing:1.5px}
.orbit{transform-origin:920px 206px;animation:orbit 28s linear infinite}
.counter{transform-origin:920px 206px;animation:orbit 40s linear reverse infinite}
.stream{stroke-dasharray:7 15;animation:stream 8s linear infinite}
.breathe{animation:breathe 4s ease-in-out infinite}.cursor{animation:blink 1.2s steps(2,end) infinite}
.rise{animation:rise 6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes orbit{to{transform:rotate(360deg)}}@keyframes stream{to{stroke-dashoffset:-220}}
@keyframes breathe{50%{opacity:.3}}@keyframes blink{50%{opacity:0}}@keyframes rise{50%{transform:translateY(-6px)}}
@media(prefers-reduced-motion:reduce){.orbit,.counter,.stream,.breathe,.cursor,.rise{animation:none}}
</style>
<rect x="1" y="1" width="1198" height="188" rx="16" fill="#ffffff" stroke="#d7d9ed"/><text x="28" y="36" class="mono" font-size="12" fill="#007f83">freeCodeCamp / PYTHON CERTIFICATION</text><text x="1172" y="36" text-anchor="end" class="mono" font-size="11" fill="#535e7b">5 PROJECTS · ONE MILESTONE</text><path class="stream" d="M72 81H1102" stroke="url(#accent)" fill="none" stroke-width="2"/><rect x="28" y="65" width="213" height="99" rx="12" fill="#f5f4ff" stroke="#d7d9ed"/><text x="43" y="88" class="mono" font-size="10" fill="#007f83">01 / COMPLETED</text><text x="43" y="118" font-size="17" font-weight="600" fill="#191b38">Config manager</text><text x="43" y="145" class="mono" font-size="9" fill="#535e7b">PARSING</text><rect x="261" y="65" width="213" height="99" rx="12" fill="#f5f4ff" stroke="#d7d9ed"/><text x="276" y="88" class="mono" font-size="10" fill="#007f83">02 / COMPLETED</text><text x="276" y="118" font-size="17" font-weight="600" fill="#191b38">Budget app</text><text x="276" y="145" class="mono" font-size="9" fill="#535e7b">OOP + FORMATTING</text><rect x="494" y="65" width="213" height="99" rx="12" fill="#f5f4ff" stroke="#d7d9ed"/><text x="509" y="88" class="mono" font-size="10" fill="#007f83">03 / COMPLETED</text><text x="509" y="118" font-size="17" font-weight="600" fill="#191b38">Polygon calculator</text><text x="509" y="145" class="mono" font-size="9" fill="#535e7b">CLASSES + GEOMETRY</text><rect x="727" y="65" width="213" height="99" rx="12" fill="#f5f4ff" stroke="#d7d9ed"/><text x="742" y="88" class="mono" font-size="10" fill="#007f83">04 / COMPLETED</text><text x="742" y="118" font-size="17" font-weight="600" fill="#191b38">Hash table</text><text x="742" y="145" class="mono" font-size="9" fill="#535e7b">DATA STRUCTURES</text><rect x="960" y="65" width="213" height="99" rx="12" fill="#f5f4ff" stroke="#d7d9ed"/><text x="975" y="88" class="mono" font-size="10" fill="#007f83">05 / COMPLETED</text><text x="975" y="118" font-size="17" font-weight="600" fill="#191b38">Tower of Hanoi</text><text x="975" y="145" class="mono" font-size="9" fill="#535e7b">RECURSION</text>
</svg>
